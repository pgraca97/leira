name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a branch makes the older run pointless. Not on main: a run
# there may be halfway through a deploy, so the next one waits its turn.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# Every job runs on `ubuntu-latest`, which GitHub moves to Ubuntu 26 from
# 19 October 2026. Nothing here should mind (Node, pnpm and Docker only).
# If a run breaks after the move, pin `runs-on: ubuntu-24.04` in each job.

jobs:
  check:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  stack:
    name: Integration and end-to-end tests
    # The slow job only runs once the quick one has passed.
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Start the local Supabase stack
        # The tests use the database, auth and the Data API. The rest only costs time.
        run: pnpm supabase start --exclude studio,imgproxy,storage-api,logflare,vector,edge-runtime,supavisor

      - name: Point the Worker at the local stack
        # The keys written here belong to the throwaway local stack or are Cloudflare's
        # public test key, so none is a secret.
        run: |
          key=$(pnpm --silent supabase status -o env | grep '^PUBLISHABLE_KEY=' | cut -d= -f2- | tr -d '"')
          test -n "$key"
          printf 'SUPABASE_URL=http://127.0.0.1:54321\nSUPABASE_PUBLISHABLE_KEY=%s\nOPENWEATHER_API_KEY=\n' "$key" > apps/web/.dev.vars
          # Cloudflare's test key: it always passes, and matches the test secret in supabase/config.toml.
          echo 'TURNSTILE_SITE_KEY=1x00000000000000000000AA' >> apps/web/.dev.vars
          # The stack's Mailpit, which takes mail on this port with no login.
          printf 'SMTP_HOST=127.0.0.1\nSMTP_PORT=54325\nSMTP_USER=leiragarden@gmail.com\nSMTP_PASSWORD=mailpit\n' >> apps/web/.dev.vars

      - run: pnpm test:integration

      - name: Install the browser for Playwright
        run: pnpm --filter @leira/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e

      - name: Keep the traces of failed browser tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7

  deploy:
    name: Deploy to production
    # Only what is on main goes live, and only once every test has passed.
    needs: stack
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Not a secret: it is part of the public address of the project's API.
      SUPABASE_PROJECT_REF: auqrvaqgomlblbcuyjlr
      APP_URL: https://leira.paulodcgraca.workers.dev
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Apply new migrations to the production database
        # Before the Worker, so the new code never runs against the old schema.
        # A migration must therefore leave the Worker that is still live working.
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        # Linked first: the database's own host has only an IPv6 address, which
        # the runners cannot reach, and linking finds the IPv4 connection pooler.
        run: |
          pnpm supabase link --project-ref "$SUPABASE_PROJECT_REF" --yes
          pnpm supabase db push --remote --yes

      - run: pnpm --filter @leira/web build

      - name: Deploy the Worker
        # The Worker's own secrets were set when it was created and stay as they are.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @leira/web exec wrangler deploy

      - name: Check that the app answers
        run: curl --fail --silent --show-error --retry 5 --retry-delay 10 --retry-all-errors "$APP_URL/api/health"
