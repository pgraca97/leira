name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  stack:
    name: Integration and end-to-end tests
    # The slow job only runs once the quick one has passed.
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Start the local Supabase stack
        # The tests use the database, auth and the Data API. The rest only costs time.
        run: pnpm supabase start --exclude studio,imgproxy,storage-api,logflare,vector,edge-runtime,supavisor

      - name: Point the Worker at the local stack
        # The key printed here belongs to the throwaway local stack, so it is not a secret.
        run: |
          key=$(pnpm --silent supabase status -o env | grep '^PUBLISHABLE_KEY=' | cut -d= -f2- | tr -d '"')
          test -n "$key"
          printf 'SUPABASE_URL=http://127.0.0.1:54321\nSUPABASE_PUBLISHABLE_KEY=%s\nOPENWEATHER_API_KEY=\n' "$key" > apps/web/.dev.vars

      - run: pnpm test:integration

      - name: Install the browser for Playwright
        run: pnpm --filter @garden/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e

      - name: Keep the traces of failed browser tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7
